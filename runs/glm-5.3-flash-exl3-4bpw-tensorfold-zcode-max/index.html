<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLM-5.3-Flash (EXL3 4 bpw) on 2× DGX Spark · Pac-Man · Local LLM</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1117; color: #f0f6fc; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 24px; height: 48px; padding: 0 20px;
    border-bottom: 1px solid #3d444d; box-sizing: border-box; font-size: 14px; white-space: nowrap; }
  header a { color: #4493f8; text-decoration: none; font-weight: 600; }
  header a:hover { text-decoration: underline; }
  .run { overflow: hidden; text-overflow: ellipsis; }
  .run b { font-size: 15px; }
  .run span { color: #9198a1; margin-left: 10px; }
  iframe { display: block; width: 100%; height: calc(100% - 48px); border: 0; }
</style>
</head>
<body>
<header>
  <a href="https://github.com/ilonalumina/local-llm-pac-man#glm-5.3-flash-exl3-4bpw-tensorfold-zcode-max">&larr; Back to the repo</a>
  <div class="run"><b>GLM-5.3-Flash</b><span>EXL3 4 bpw · 2× DGX Spark · TensorFold · ZCode · Max</span></div>
</header>
<iframe id="game" src="pacman.html" title="GLM-5.3-Flash Pac-Man"></iframe>
<script>
  const game = document.getElementById('game');
  const focusGame = () => { game.focus(); try { game.contentWindow.focus(); } catch (e) {} };
  game.addEventListener('load', focusGame);
  document.addEventListener('keydown', focusGame);
</script>
</body>
</html>
